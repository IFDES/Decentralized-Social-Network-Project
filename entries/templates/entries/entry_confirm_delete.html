<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete entry - {{ author.display_name }}</title>
</head>
<body>
  <h1>Delete entry</h1>
  <p>Are you sure you want to delete this entry?</p>
  <p><strong>{{ entry.title|default:"(untitled entry)" }}</strong></p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Delete</button>
  </form>

  <p>
    <a href="{% url 'entries:entry-detail' author.uuid entry.uuid %}">Back to entry</a> |
    <a href="{% url 'entries:author-entries' author.uuid %}">Back to entries list</a>
  </p>
</body>
</html>
