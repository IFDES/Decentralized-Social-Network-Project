<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    form { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    label { display: block; margin-top: 10px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 10px 12px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Login</h1>

  {% if form.errors %}
    <p class="error">Invalid username or password.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <label for="id_username">Username</label>
    {{ form.username }}

    <label for="id_password">Password</label>
    {{ form.password }}

    <button type="submit">Log in</button>
  </form>

  {% if next %}
    <p class="small">After login you will go to: <code>{{ next }}</code></p>
  {% endif %}

  <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</body>
</html>
