<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in - Social Distribution</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #111827;
      min-height: 100vh;
      position: relative;
    }

    /* Logo anchor in top-left corner */
    .logo-anchor {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
    }

    .logo-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #111827;
      color: #f9fafb;
      font-size: 24px;
      font-weight: 700;
    }

    /* Optional geometric accent bottom-right */
    .geometric-accent {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 120px;
      height: 120px;
      opacity: 0.08;
      pointer-events: none;
    }

    .geometric-accent svg {
      width: 100%;
      height: 100%;
    }

    /* Centered dominant layout */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .form-container {
      width: 100%;
      max-width: 550px;
      background: #ffffff;
      border-radius: 12px;
      padding: 40px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .form-header {
      margin-bottom: 32px;
      text-align: center;
    }

    .form-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .form-subtitle {
      font-size: 1rem;
      color: #6b7280;
    }

    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #dc2626;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #374151;
      font-size: 0.95rem;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      color: #111827;
      background: #ffffff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-input:focus {
      outline: none;
      border-color: #4361ee;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #6b7280;
      font-size: 1.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .password-toggle:hover {
      color: #111827;
    }

    .submit-button {
      width: 100%;
      padding: 12px 16px;
      background: #4361ee;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      min-height: 44px;
    }

    .submit-button:hover {
      background: #3a0ca3;
    }

    .submit-button:active {
      background: #2d0a7f;
    }

    .signup-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }

    .signup-text {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .signup-link {
      display: inline-block;
      padding: 10px 24px;
      background: #f3f4f6;
      color: #111827;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.15s;
      min-height: 44px;
    }

    .signup-link:hover {
      background: #e5e7eb;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .logo-anchor {
        top: 16px;
        left: 16px;
      }

      .logo-box {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .login-container {
        padding: 80px 16px 40px;
      }

      .form-container {
        padding: 32px 24px;
      }

      .form-title {
        font-size: 1.5rem;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .form-container {
        max-width: 80%;
      }
    }

    @media (min-width: 1025px) {
      .form-container {
        max-width: 550px;
      }
    }
  </style>
</head>
<body>
  <!-- Logo anchor top-left -->
  <div class="logo-anchor">
    <div class="logo-box">SD</div>
  </div>

  <!-- Optional geometric accent bottom-right -->
  <div class="geometric-accent">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="15" fill="#111827" />
      <line x1="80" y1="120" x2="120" y2="80" stroke="#111827" stroke-width="2" />
      <rect x="60" y="60" width="30" height="30" fill="none" stroke="#111827" stroke-width="2" />
    </svg>
  </div>

  <!-- Centered dominant form -->
  <div class="login-container">
    <div class="form-container">
      <div class="form-header">
        <h2 class="form-title">Welcome back</h2>
        <p class="form-subtitle">Log in to your account to continue</p>
      </div>

      {% if form.errors or form.non_field_errors %}
      <div class="error-message">
        {% if form.non_field_errors %}
          {{ form.non_field_errors.0 }}
        {% else %}
          Please correct the errors below.
        {% endif %}
      </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username" class="form-label">Username</label>
          <input
            type="text"
            name="username"
            id="id_username"
            class="form-input"
            value="{{ form.username.value|default:'' }}"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="id_password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              name="password"
              id="id_password"
              class="form-input"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Toggle password visibility"
            >
              👁️
            </button>
          </div>
        </div>

        <input type="hidden" name="next" value="{{ next }}" />

        <button type="submit" class="submit-button">Log in</button>
      </form>

      <div class="signup-section">
        <p class="signup-text">Don't have an account?</p>
        <a href="{% url 'signup' %}" class="signup-link">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    // Password visibility toggle
    (function() {
      const toggleButton = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('id_password');
      let isVisible = false;

      toggleButton.addEventListener('click', function() {
        isVisible = !isVisible;
        
        if (isVisible) {
          passwordInput.type = 'text';
          toggleButton.textContent = '👁️‍🗨️';
          toggleButton.setAttribute('aria-label', 'Hide password');
        } else {
          passwordInput.type = 'password';
          toggleButton.textContent = '👁️';
          toggleButton.setAttribute('aria-label', 'Show password');
        }
      });
    })();
  </script>
</body>
</html>
